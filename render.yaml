services:
  - type: web
    name: situations-sortants
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: situations-db
          property: connectionString

databases:
  - name: situations-db
    plan: free
    databaseName: situations
    user: situations